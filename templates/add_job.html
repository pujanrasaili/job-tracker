<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="header" style="margin-bottom: 28px;">
    <a href="/" class="btn-add" style="margin-bottom: 0;">← Back</a>
</div>
<h1 style="background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; font-weight: 700; margin-bottom: 24px;">➕ Add New Job</h1>
            <form action="/add" method="POST" class="job-form">
                <input type="text" name="company" placeholder="Company Name" required>
                <input type="text" name="role" placeholder="Job Role" required>
                <input type="text" name="location" placeholder="Location (e.g. Remote, London)">
                <input type="date" name="date_applied" required>
                <select name="status">
                    <option>Applied</option>
                    <option>Interview</option>
                    <option>Offer</option>
                    <option>Rejected</option>
                </select>
                <input type="url" name="link" placeholder="Job Posting URL (optional)">
                <textarea name="notes" placeholder="Notes (optional)" rows="4"></textarea>
                <button type="submit">💾 Save Job</button>
            </form>
        </div>
    </div>
</body>
</html>
